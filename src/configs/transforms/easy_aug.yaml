defaults:
  - base
  - _self_

instance_transforms:
  train:
    audio:
      _target_: torchvision.transforms.v2.Compose

      transforms:
        - _target_: src.transforms.wav_augs.Gain
          min_gain_in_db: -6.0
          max_gain_in_db: 6.0
          p: 0.3

        - _target_: src.transforms.wav_augs.AddBackgroundNoise
          background_paths: data/augmentation/RIRS_NOISES/pointsource_noises
          min_snr_in_db: 20.0
          max_snr_in_db: 30.0
          p: 0.2
          sample_rate: 16000

    spectrogram:
      _target_: torchvision.transforms.v2.Compose

      transforms:
        - _target_: src.transforms.spec_augs.FrequencyMasking
          freq_mask_param: 8

        - _target_: src.transforms.spec_augs.TimeMasking
          time_mask_param: 20