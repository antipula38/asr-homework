# Small test configuration for the EMA training pipeline

defaults:
  - ema
  - override /datasets: onebatchtest
  - _self_

trainer:
  n_epochs: 2
  epoch_len: 2
  resume_from: null

dataloader:
  batch_size: 2
  num_workers: 0
  persistent_workers: false

writer:
  run_name: ema_smoke_test
  project_name: asr-ema-tests