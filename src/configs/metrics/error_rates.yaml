train: []

inference:
  # Argmax CER
  - _target_: src.metrics.ArgmaxErrorMetric
    calc_metric:
      _target_: src.metrics.utils.calc_cer
      _partial_: true
    name: "CER_(Argmax)"

  # Argmax WER
  - _target_: src.metrics.ArgmaxErrorMetric
    calc_metric:
      _target_: src.metrics.utils.calc_wer
      _partial_: true
    name: "WER_(Argmax)"

  # Beam Search CER
  - _target_: src.metrics.BeamSearchErrorMetric
    calc_metric:
      _target_: src.metrics.utils.calc_cer
      _partial_: true
    beam_size: 10
    name: "CER_(BeamSearch)"

  # Beam Search WER
  - _target_: src.metrics.BeamSearchErrorMetric
    calc_metric:
      _target_: src.metrics.utils.calc_wer
      _partial_: true
    beam_size: 10
    name: "WER_(BeamSearch)"