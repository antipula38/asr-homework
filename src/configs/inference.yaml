# defaults:
#   - model: baseline
#   - metrics: example
#   - datasets: example_eval # we do not want to run inference on training data
#   - dataloader: example
#   - transforms: example
#   - _self_
# inferencer:
#   device_tensors: ["data_object", "labels"] # which tensors should be on device (ex. GPU)
#   device: auto # device name or "auto"
#   save_path: "example" # any name here, can be a dataset name
#   seed: 1
#   from_pretrained: "saved/model_best.pth" # path to the pretrained model

defaults:
  - model: deepspeech2
  - metrics: error_rates
  - datasets: onebatchtest_eval
  - dataloader: example
  - transforms: example_only_instance
  - _self_

text_encoder:
  _target_: src.text_encoder.CTCTextEncoder

inferencer:
  device_tensors:
    - spectrogram
    - text_encoded
  device: auto
  save_path: "beam_search_test"
  seed: 1
  from_pretrained: "saved/testing/model_best.pth"
